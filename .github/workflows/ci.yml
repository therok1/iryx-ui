name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build before type-checking: the examples check against the built types a
      # consumer would get, so dist has to exist first. test/build.test.ts also
      # inspects dist, and skips when it is absent so a local `pnpm test` still
      # works without building.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # The docs prerender every page, so this is a second SSR pass over the
      # components the docs actually use — and it fails on a dead link.
      - run: pnpm --filter docs build
      # The examples use combinations the docs pages never do, so building them
      # catches props and variants that do not exist.
      - run: pnpm build:examples
