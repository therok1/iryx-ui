name: Release

# A push to main does not publish. While changesets are pending, this opens or
# updates a "Version Packages" PR holding the bump and changelog; merging that
# PR leaves no changesets, so the next run publishes. The merge is the release
# button, and `changeset version` is run for you rather than by hand.
#
# Needs an NPM_TOKEN repo secret (Granular Access Token, read/write on
# iryx-ui) and "Allow GitHub Actions to create and approve pull requests"
# enabled under Settings → Actions → General.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
