name: Release

# A push to main does not publish. While changesets are pending, this opens or
# updates a "Version Packages" PR holding the bump and changelog; merging that
# PR leaves no changesets, so the next run publishes. The merge is the release
# button, and `changeset version` is run for you rather than by hand.
#
# Publishes via npm Trusted Publishing: npmjs.com trusts this repo and this
# workflow filename, GitHub mints a short-lived OIDC token at publish time, and
# no long-lived credential exists anywhere. `id-token: write` below is what
# makes that possible. Provenance is attached automatically, so it is not
# configured here.
#
# Also needs "Allow GitHub Actions to create and approve pull requests" enabled
# under Settings → Actions → General, or opening the version PR fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # `pnpm release` used to do this; publishing directly means the build has
      # to happen here, or `files` in package.json points at a missing dist.
      # It also runs before the checks because the examples type-check against
      # the built types a consumer would get, so dist has to exist by then.
      - run: pnpm build

      - run: pnpm typecheck
      - run: pnpm test

      # Trusted publishing needs a CLI that can present the OIDC token. Node 22
      # ships npm 10, which cannot; `changeset publish` would route through
      # `pnpm publish`, which has no OIDC support either — that combination
      # published with no credential at all and npm answered E404 on the PUT.
      - run: npm install -g npm@latest

      # No `publish` input: this only opens or updates the version PR.
      - name: Create release PR
        id: changesets
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # "No changesets" is not the same as "unreleased": every later push to
      # main also has none, and npm rejects publishing over a version that
      # exists. Ask the registry instead of assuming.
      - name: Check whether this version is already on npm
        id: state
        run: |
          VERSION=$(node -p "require('./packages/iryx-ui/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "iryx-ui@$VERSION" version >/dev/null 2>&1; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "iryx-ui@$VERSION is already published; nothing to do."
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.state.outputs.needs_publish == 'true'
        working-directory: packages/iryx-ui
        run: npm publish --access public --provenance

      # An annotated tag carries its own message. A lightweight one is just a
      # pointer, so GitHub shows the commit it lands on — which is always the
      # merge of the version PR, hence tags reading "Merge pull request #2".
      - name: Tag and publish release notes
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.state.outputs.needs_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.state.outputs.version }}"
          TAG="iryx-ui@$VERSION"
          node scripts/release-notes.mjs "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -F RELEASE_NOTES.md
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
